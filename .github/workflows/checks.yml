name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Regenerate the synthetic data
        run: python generate_data.py

      - name: Run the reconciliation
        run: python reconcile.py | tee run.log

      - name: Every injected issue found, no false alarms
        run: |
          grep -q "Missed: 0   False alarms: 0" run.log

      - name: Results identical to the published ones
        run: git diff --exit-code -- data output
